name: Test mobile lesson notification
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send today's published lesson link once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://bonjaykim.github.io/my-english-study/
          TEST_ID: ${{ github.run_id }}
        run: python scripts/notify_github.py --test-id "$TEST_ID"
