name: Build and publish lessons
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 Asia/Seoul on the following UTC day
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish today's prepared lesson
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/publish_due.py
      - name: Save published HTML and source
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data business queue index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily business English lesson"
            git push
          fi
      - run: python scripts/build.py --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
